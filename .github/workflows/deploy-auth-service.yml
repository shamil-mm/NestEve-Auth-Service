name: Deploy Auth-service to Kubernetes


on:
  push:
    branches:
      - develop
    paths:
      - '**'
      - '.github/workflows/deploy-auth-service.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t shamilmm/auth-service:latest .
          docker push shamilmm/auth-service:latest 

      - name: Set up environment variables from .env file
        run: |
          echo "${{ secrets.AUTH_ENV_FILE }}" > auth.env
      
      - name: Apply auth secret to Kubernetes
        run: |
          kubectl delete secret auth-secret --ignore-not-found
          kubectl create secret generic auth-secret --from-env-file=auth.env

      - name: Create Firebase key secret from base64
        run: |
          echo "${{ secrets.FIREBASE_KEY_JSON_B64 }}" | base64 --decode > firebase-key.json

          kubectl delete secret firebase-key-secret --ignore-not-found
          kubectl create secret generic firebase-key-secret \
            --from-file=serviceAccountKey.json=firebase-key.json

          rm firebase-key.json
            
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ./k8s/development/deployment.yaml
          kubectl apply -f ./k8s/development/service.yaml