apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: shamilmm/auth-service:latest
          imagePullPolicy: always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
               name: auth-secret
          volumeMounts:
            - name: firebase-key-volume
              mountPath: /secrets/firebase
              readOnly: true
      volumes:
        - name: firebase-key-volume
          secret:
            secretName: firebase-key-secret
